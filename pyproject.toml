[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"


[tool.webapp]
app_name = "dia"
framework = "infra"

[tool.gds-idea-app-kit]
framework = "infra"
app_name = "dia"
tool_version = "0.5.4"

[tool.gds-idea-app-kit.files]
".github/CODEOWNERS" = "sha256:56d5fd290e2cb6761e90c0aed4ea903ea99526250fb86e9384fe424e0945727d"
LICENCE = "sha256:21cc325b3181cb748845827425d37ce04b3dc563835bbf50fafbc56a5eb68c48"
".github/workflows/ci_cd_cdk_app.yml" = "sha256:46202692b6be60616364f177be030d8ba760c10717c97a69b0723c6c0e85b7b3"
".github/workflows/ci_pr_cdk_app.yml" = "sha256:40662f487f20b93f80ab0cf903c3c59a2d1806ba2ea9081bdb5076b7b1d576fc"
".github/dependabot.yml" = "sha256:46db4f8808d2d40d4a11e915ff38f0c5ebf837505d60442b228cab20a18014ea"
[project]
name = "dia"
dynamic = ["version"]
description = "Department Intelligence Agent - knowledge graph extraction pipeline for government documents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "aioboto3>=13.0.0",
    "boto3>=1.35.0",
    "gds-idea-cdk-constructs>=0.3.0",
    "graphrag-toolkit-lexical-graph",
    "llama-index-vector-stores-opensearch>=0.6.2",
    "numpy<2",                          # pinned: graphrag-toolkit incompatible with numpy 2.x
    "pdfplumber>=0.11.9",
    "pydantic>=2.9.0",
    "pypdf>=6.4.2",
    "python-docx>=1.2.0",
    "rapidfuzz>=3.14.3",
    "sentence-transformers>=5.2.0",
    "typer>=0.15.0",
]

[[tool.uv.index]]
name = "gds-idea"
url = "https://co-cddo.github.io/gds-idea-pypi/simple/"

[project.optional-dependencies]
cdk = [
    "aws-cdk-lib>=2.252.0",
    "constructs>=10.0.0,<11.0.0",
    "gds-idea-cdk-constructs>=0.3.0",
]

agent =[
    "graphrag-toolkit-lexical-graph",
    "strands-agents>=1.20.0",
    "fastmcp>=2.14.1",
    "awswrangler",
    "tavily"
]

[project.scripts]
dia = "dia.cli:app"

[project.urls]
Homepage = "https://github.com/co-cddo/gds-idea-dia"
Repository = "https://github.com/co-cddo/gds-idea-dia"
Issues = "https://github.com/co-cddo/gds-idea-dia/issues"

[tool.uv.sources]
graphrag-toolkit-lexical-graph = { url = "https://github.com/awslabs/graphrag-toolkit/archive/refs/tags/v3.17.0.zip", subdirectory = "lexical-graph" }
gds-idea-cdk-constructs = { index = "gds-idea" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "ruff>=0.11.0",
    "moto[s3]>=5.0.0",
    "ipykernel",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
# src/dia/agent/ is a mid-refactor scaffold (see src/dia/agent/docs/agent-refactor.md).
"src/dia/agent/mcp/tools/knowledge_base.py" = ["F821"]
"src/dia/agent/mcp/tools/athena.py" = ["F821"]
# Deliberate SCREAMING_CASE for constant-like local values inside patch functions.
"src/dia/agent/patches/entity_search.py" = ["N806"]
"src/dia/agent/patches/retry.py" = ["N806"]
# Prompt content moved verbatim from src/system_prompts.py — not reflowed to preserve fidelity.
"src/dia/agent/prompts/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dia"]

[tool.ruff.format]
quote-style = "double"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/dia/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests that run the full pipeline with mocks",
]
